<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Sun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto; /* Permite desplazamiento si la pantalla es pequeña */
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Contenedor Principal */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
            margin: auto;
        }

        /* Animación de entrada de la tarjeta */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo de la Imagen */
        .photo-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        /* Textos */
        h1 {
            color: #ff477e;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
            line-height: 1.3;
        }

        /* Botón Interactivo de Latido */
        .btn-tocame {
            background: #ff477e;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s ease, background 0.3s ease;
            animation: latido 1.2s infinite;
            display: inline-block;
            margin: 10px 0;
            outline: none;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 5px 25px rgba(255, 71, 126, 0.7); }
            100% { transform: scale(1); }
        }

        .btn-tocame:hover {
            background: #ff2a65;
        }

        /* Mensaje Sorpresa */
        .message-box {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 229, 236, 0.6);
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #ff477e;
            margin-top: 15px;
        }

        .message-box.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 600;
        }

        /* Animación de Corazones de Fondo */
        .heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.4);
            font-size: 20px;
            pointer-events: none;
            animation: float 6s linear infinite;
            bottom: -50px;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Corazones de la explosión */
        .burst-heart {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: burst 1s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Amor -->
    <div class="card">
        <div class="photo-container">
            <img src="Faye.png" alt="Para Mi Sun">
        </div>
        
        <!-- Tu nuevo título personalizado -->
        <h1>Oye amor, Chan Rak Khun</h1>
        
        <!-- Botón interactivo asegurado abajo del título -->
        <button class="btn-tocame" id="btnTocame" onclick="revelarSorpresa(event)">¡Tócame! ❤️</button>

        <!-- Tu nuevo bloque de texto oculto -->
        <div class="message-box" id="mensajeSorpresa">
            <p>No estes triste, pronto tendremos 2 años. ✨🍲</p>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const heartTypes = ['❤️', '💖', '💝', '💕'];
            heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            heart.style.left = Math.random() * 100 + "vw";
            
            const size = Math.random() * 20 + 15;
            heart.style.fontSize = size + "px";
            
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = duration + "s";
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 400);

        function revelarSorpresa(event) {
            const btn = document.getElementById('btnTocame');
            const msg = document.getElementById('mensajeSorpresa');

            btn.style.display = 'none';
            msg.classList.add('show');

            for (let i = 0; i < 35; i++) {
                createBurstHeart(event.clientX, event.clientY);
            }
        }

        function createBurstHeart(clientX, clientY) {
            const burst = document.createElement('div');
            burst.classList.add('burst-heart');
            
            const heartTypes = ['❤️', '💖', '💝', '💕', '✨'];
            burst.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            burst.style.left = clientX + 'px';
            burst.style.top = clientY + 'px';
            burst.style.fontSize = Math.random() * 15 + 15 + 'px';

            const x = (Math.random() - 0.5) * 300;
            const y = (Math.random() - 0.5) * 300;
            
            burst.style.setProperty('--x', `${x}px`);
            burst.style.setProperty('--y', `${y}px`);

            document.body.appendChild(burst);

            setTimeout(() => {
                burst.remove();
            }, 1000);
        }
    </script>

</body>
</html>
